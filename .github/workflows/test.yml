name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Edge
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $edge)) {
            $edge = Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'
          }
          if (-not (Test-Path $edge)) { throw 'Microsoft Edge is not installed on this runner' }
          "DSH_EDGE_PATH=$edge" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Integration tests (headless)
        env:
          DSH_TEST_HEADLESS: '1'
        run: npm test
